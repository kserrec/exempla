name: Propose a repository
description: Suggest production software or a lower-level educational exemplar for evidence-backed review.
title: "[Candidate]: "
body:
  - type: markdown
    attributes:
      value: |
        A candidate is accepted only after one representative pinned path passes
        the coding-relevance and quality gates and earns its Level from all four
        published dimensions. Empty slots and popularity never lower that bar.
  - type: input
    id: repository-url
    attributes:
      label: Repository URL
      description: Link to the public upstream GitHub repository.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: dropdown
    id: source-kind
    attributes:
      label: Source kind
      description: Educational exemplars are eligible only at Levels 1 and 2 and must be complete, verifiable software rather than exercises or scaffolds.
      options:
        - Production software
        - Educational exemplar
    validations:
      required: true
  - type: input
    id: pinned-revision
    attributes:
      label: Inspected revision
      description: Enter the full 40-character commit SHA you reviewed.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Catalog language
      description: Name the meaningful first-party implementation language you inspected.
      placeholder: Python
    validations:
      required: true
  - type: textarea
    id: purpose-evidence
    attributes:
      label: Purpose evidence
      description: For production, prove the genuine non-teaching function. For an educational exemplar, identify the creator, teaching intent, completed artifact, verification, and why it is credible source to learn from.
    validations:
      required: true
  - type: textarea
    id: coding-relevance
    attributes:
      label: Coding relevance and domain context
      description: Explain the transferable lesson, any short required domain context, and why programming rather than specialist subject matter drives the path.
    validations:
      required: true
  - type: textarea
    id: learner-path
    attributes:
      label: Inspected learning path
      description: Assign a stable path slug and name the goal, first source file and reason, supporting implementation and tests, prerequisites, concepts developed, and complete trace.
      placeholder: |
        Path slug:
        Goal:
        Start path and reason:
        Supporting files:
        Prerequisites:
        Concepts developed:
        Domain context:
        Entry-to-result trace:
    validations:
      required: true
  - type: textarea
    id: quality-evidence
    attributes:
      label: Eight quality findings
      description: Record source quality, architecture, naming and idiom, tests, documentation, traceability, maintainability, and educational value for this exact path.
    validations:
      required: true
  - type: textarea
    id: level-evidence
    attributes:
      label: Learning-level evidence
      description: Score before consulting a gap. Give recurring signals and reasons for all four dimensions, then calculate the Level and guardrails.
      placeholder: |
        Language technique: score, signals, reason
        Behavioral reasoning: score, signals, reason
        Design span: score, signals, reason
        Constraint burden: score, signals, reason
        Formula result and guardrail:
    validations:
      required: true
  - type: textarea
    id: license
    attributes:
      label: License evidence
      description: State the exact SPDX expression and every pinned file URL needed to prove it for the selected path.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I inspected the pinned source; this proposal is not based only on metadata, popularity, or reputation.
          required: true
        - label: This is either genuine production software or a complete, coherent, licensed, verifiable educational exemplar—not an exercise, starter, answer dump, or snippet collection.
          required: true
        - label: If this is an educational exemplar, its calculated and published Level is 1 or 2.
          required: true
        - label: I scored observed path evidence before consulting the desired catalog slot.
          required: true
        - label: This repository would contribute no more than two catalog paths, would not repeat within one language/Level bucket, and fits the 3/3/2/2/2 capacity map.
          required: true
        - label: I understand that this issue proposes review and does not pre-approve the candidate.
          required: true
