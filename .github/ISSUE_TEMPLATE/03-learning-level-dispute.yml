name: Dispute a learning-level placement
description: Request an evidence-backed review of an entry's path scores or final Level.
title: "[Level review]: "
body:
  - type: input
    id: entry-url
    attributes:
      label: Exempla entry
      description: Link to the catalog entry whose selected path you reviewed.
      placeholder: https://github.com/kserrec/exempla/blob/main/languages/rust/README.md
    validations:
      required: true
  - type: dropdown
    id: disputed-dimension
    attributes:
      label: Disputed score
      options:
        - Language technique
        - Behavioral reasoning
        - Design span
        - Constraint burden
        - Final Level
        - Multiple dimensions
    validations:
      required: true
  - type: input
    id: pinned-revision
    attributes:
      label: Reviewed revision
      description: Enter the full commit SHA recorded by the entry.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: textarea
    id: rubric-anchor
    attributes:
      label: Relevant rubric anchor
      description: Identify the current score and the definition in docs/learning-levels.md that the path does or does not satisfy.
    validations:
      required: true
  - type: textarea
    id: source-evidence
    attributes:
      label: Observed path evidence
      description: Link to concrete files at the recorded revision and explain the recurring signals in the published path.
    validations:
      required: true
  - type: textarea
    id: proposed-placement
    attributes:
      label: Proposed four-score placement
      description: State all four whole-number scores, formula result, and any guardrail, even when disputing only one dimension.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I reviewed the revision and learning path recorded by Exempla, not a moving default branch.
          required: true
        - label: My reasoning uses published anchors and observed recurring evidence, not popularity or a desired open slot.
          required: true
