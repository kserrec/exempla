name: Validate catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test catalog tooling
        run: python3 -m unittest discover -s tests -v
      - name: Validate catalog
        run: python3 scripts/catalog.py validate
      - name: Check generated Markdown
        run: python3 scripts/catalog.py check-generated
